<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>山海门户 · shanhai portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 页面骨架（设计 V0.3 §3.2）：固定顶栏（LOGO/三一级导航/Token 区/连接状态）+ 页头 + 内容区 + 页脚。
       Agent 一级导航按批次计划 7-4 加入。 -->
  <header class="app-header">
    <div class="brand"><span class="brand__logo" aria-hidden="true">山</span><span class="brand__name">山海门户</span></div>
    <nav class="nav" aria-label="主导航">
      <a href="#/tasks" data-nav="tasks" class="nav-link">应龙·任务</a>
      <a href="#/approvals" data-nav="approvals" class="nav-link">玄武·审批</a>
      <a href="#/observe" data-nav="observe" class="nav-link">观测</a>
    </nav>
    <div class="header-side">
      <!-- TASK-128：口令区为兜底入口（显式 config/env Token 场景）；常规使用经每次启动自动登录，无需理解任何凭证概念。 -->
      <form id="token-form" class="token-form">
        <label class="visually-hidden" for="token-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">访问口令</label>
        <input id="token-input" type="password" placeholder="访问口令（一般无需填写，启动时自动登录）" autocomplete="off" />
        <button type="submit" class="btn btn--secondary btn--sm">保存</button>
        <span id="token-state" class="token-state"></span>
      </form>
      <button id="connection-indicator" class="conn conn--unknown" type="button" role="status" title="连接状态（点击立即探测）">检测中</button>
    </div>
  </header>
  <main id="view" aria-live="polite">
    <p class="hint">加载中……</p>
  </main>
  <footer class="app-footer">
    <span>版本 <span id="app-version">—</span></span>
    <span>esbuild 单文件构建（运行期零依赖）</span>
    <span>设计规格：docs/phase7/01-山海门户界面重设计-V0.3.md（仓库内路径）</span>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
